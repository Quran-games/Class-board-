<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة حفظ القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="st" viewBox="0 0 24 24"><path d="M12 2.4l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></symbol>
    <radialGradient id="goldStar" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFF0A0"/><stop offset="55%" stop-color="#FFC928"/><stop offset="100%" stop-color="#F59A00"/></radialGradient>
  </defs>
</svg>

<div class="frame">
<main class="board" id="board">

  <!-- Top: title and today's goals -->
  <div class="top">
    <header class="hero">
      <svg class="chest" id="chest" viewBox="0 0 120 100" aria-hidden="true">
        <circle class="glow" cx="60" cy="42" r="34" fill="#FFE27A" opacity=".6"/>
        <g class="spark" fill="#F5B400" font-size="12"><text x="14" y="22">✦</text><text x="98" y="18">✦</text><text x="56" y="10">✦</text></g>
        <rect x="36" y="24" width="48" height="26" rx="3" fill="#1E7A4C" stroke="#E9B530" stroke-width="2.5"/>
        <rect x="50" y="29" width="20" height="15" rx="2" fill="none" stroke="#E9B530" stroke-width="2"/>
        <rect x="10" y="46" width="100" height="44" rx="6" fill="#9B5A2B" stroke="#6B3A17" stroke-width="3"/>
        <rect x="10" y="56" width="100" height="6" fill="#E9A92A"/>
        <rect x="24" y="46" width="7" height="44" fill="#E9A92A"/><rect x="89" y="46" width="7" height="44" fill="#E9A92A"/>
        <rect x="53" y="52" width="14" height="16" rx="3" fill="#F2C24A" stroke="#9C6A10" stroke-width="2"/>
        <g class="lid">
          <path d="M10 48 V36 Q10 18 60 18 Q110 18 110 36 V48 Z" fill="#B06A33" stroke="#6B3A17" stroke-width="3"/>
          <rect x="24" y="20" width="7" height="28" fill="#E9A92A"/><rect x="89" y="20" width="7" height="28" fill="#E9A92A"/>
        </g>
      </svg>
      <div class="sign"><h1>رحلة حفظ القرآن</h1></div>
    </header>
    <section class="panel goals">
      <h2 class="tag">هدفنا اليوم 🎯</h2>
      <ul class="goal-list" id="goals"></ul>
    </section>
  </div>

  <!-- Right: groups -->
  <div class="col col-right">
    <section class="panel groups grow">
      <h2 class="tag">مجموعاتنا 👥</h2>
      <div class="list" id="groups"></div>
    </section>
  </div>

  <!-- Left: students outside their group -->
  <div class="col col-left">
    <section class="panel out grow">
      <h2 class="tag">الطلاب خارج المجموعة</h2>
      <p class="rule">يعود إلى مجموعته بعد جمع ٥ نجوم من خلال سلوكه وانضباطه وترديده وتركيزه.</p>
      <div class="list" id="outs"></div>
    </section>
    <button class="new-class" id="newClass" type="button">حصة جديدة</button>
  </div>

</main>
</div>

<script src="script.js"></script>
</body>
</html>
